server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxied so the frontend can be reached from any host/IP (e.g. a phone on the same
    # network) without needing to know the backend's address at build time — the browser only
    # ever talks to this single origin, and nginx forwards server-to-server from here.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://backend:4000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
